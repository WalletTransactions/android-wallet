# Сборка debug-APK (артефакт wallet-debug-1.0.<code>-<sha>) и юнит-тесты на каждый
# push в main и на pull request.
#
# Установка на устройство и инструментальные тесты — не здесь: им нужен Pixel
# по USB, это делает Jenkins (BuildPlatform). См. org/docs/TODO_ci.md.
#
# JDK 17 — как в ci/Containerfile (Gradle 7.5 не работает на JDK 21). Android
# SDK берётся с раннера; недостающие build-tools Gradle докачает сам.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # На уровне job, а не шага: if шага видит только env job/workflow.
      DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Debug-подпись — тот же ключ, что у сборок на телефоне (~/.android/debug.keystore
      # хоста, см. deploy-debug.sh): иначе APK из артефакта не встанет поверх
      # установленного (INSTALL_FAILED_UPDATE_INCOMPATIBLE), только после удаления
      # приложения вместе с данными. Секрета нет (форк, PR извне) — шаг пропускается,
      # Gradle сгенерирует свой ключ.
      - name: Debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      # gradlew лежит в git без бита исполнения — запускаем через bash.
      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --console=plain --no-daemon

      # versionCode растёт при каждой сборке (app/version.properties) — на раннере
      # он свой, поэтому в имени артефакта ещё и короткий sha коммита.
      # В pull request github.sha — служебный merge-коммит, а нужен коммит ветки.
      - name: APK name
        id: apk
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=$(grep '^VERSION_CODE=' app/version.properties | cut -d= -f2)
          echo "name=wallet-debug-1.0.${code}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
