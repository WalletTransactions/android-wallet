# Релиз: тег v* (например, v1.1.0) → сборка APK → GitHub Release с APK.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Подпись. Android ставит обновление только с тем же ключом, что у установленного
# приложения, поэтому ключ релизов должен быть постоянным:
# - заданы секреты RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
#   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD — собирается release-APK и
#   подписывается этим ключом; релизы обновляют друг друга;
# - секретов нет — debug-APK с ключом, который Gradle генерирует на раннере.
#   Ключ каждый раз новый: такой APK ставится только на чистое устройство и не
#   обновляет ни прошлый релиз, ни сборку с телефона. Это пишется в описание релиза.
# Ключ хоста (~/.android/debug.keystore) и ключ Google Play (Keystore/) сюда не
# кладутся — решение 2026-10-24; для релизов нужен отдельный ключ.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (создаётся на текущем коммите ветки), например v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # На уровне job: if шага видит только env job/workflow.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # gradlew лежит в git без бита исполнения — запускаем через bash.
      - name: Unit tests
        run: bash ./gradlew :app:testProdDebugUnitTest --console=plain --no-daemon

      # Релиз — только вариант prod (openspec android-flavors, D3): qa ставят
      # с хоста (deploy-debug.sh / Jenkins), в GitHub Releases он не нужен.

      - name: Release APK (signed)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleProdRelease --console=plain --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -f 4 app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNING=release" >> "$GITHUB_ENV"

      - name: Debug APK (runner key)
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          bash ./gradlew :app:assembleProdDebug --console=plain --no-daemon
          cp app/build/outputs/apk/prod/debug/app-prod-debug.apk "$RUNNER_TEMP/app.apk"
          echo "SIGNING=debug" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep '^VERSION_CODE=' app/version.properties | cut -d= -f2)
          apk="wallet-${TAG}-1.0.${code}.apk"
          cp "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/$apk"
          {
            echo "versionName 1.0.${code}, коммит ${GITHUB_SHA::7}."
            echo
            if [ "$SIGNING" = "debug" ]; then
              echo "> **Подписан временным ключом сборки.** Ставится только на устройство без"
              echo "> приложения: поверх прошлого релиза или сборки с телефона не встанет"
              echo "> (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Удаление приложения стирает его данные —"
              echo "> перед этим синхронизируйтесь с сервером или сделайте экспорт."
            else
              echo "Подписан ключом релизов — обновляет прошлые релизы."
            fi
          } > "$RUNNER_TEMP/notes.md"
          # Тег из ручного запуска создаётся на текущем коммите.
          gh release create "$TAG" "$RUNNER_TEMP/$apk" \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
