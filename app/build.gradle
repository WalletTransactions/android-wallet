apply plugin: 'com.android.application'

// Автоинкремент версии сборки: файл-счётчик version.properties хранит
// VERSION_CODE и растёт на 1 при каждой настоящей сборке (assemble/bundle/
// install — не при --stop, tasks и прочей служебной синхронизации IDE,
// иначе счётчик скакал бы от одного открытия проекта). versionName
// собирается из него же ("1.0.<code>"), так что "Версия" в
// Настройки → О приложении растёт вместе со сборками без ручной правки.
def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def autoVersionCode = (versionProps.getProperty('VERSION_CODE', '0')).toInteger()

def isRealBuild = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains('assemble') || n.contains('bundle') || n.contains('install')
}
if (isRealBuild) {
    autoVersionCode += 1
    versionProps.setProperty('VERSION_CODE', autoVersionCode.toString())
    versionPropsFile.withOutputStream { versionProps.store(it, 'Auto-incremented build version code') }
}

// Дата и время сборки — отдельным полем BuildConfig.BUILD_TIME, показывается
// рядом с версией на том же экране (SettingsActivity).
def buildTimeFormatted = new Date().format("yyyy-MM-dd HH:mm", TimeZone.getTimeZone("UTC"))

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.wallettransactions"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode autoVersionCode
        versionName "1.0.${autoVersionCode}"
        buildConfigField "String", "BUILD_TIME", "\"${buildTimeFormatted}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    buildToolsVersion '29.0.3'
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    // Нужно Robolectric-тестам (HardWipeCacheInvalidationTest) — без этого
    // ресурсы/assets модуля (в т.ч. assets/seed.json, который читает
    // WalletFillData.InsertFirstDictionary) не видны юнит-тестам, идущим на
    // голой JVM, а не на устройстве/эмуляторе.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Миграция на AndroidX (org/docs/TODO_mobile_sync.md, Фаза 0) — 1:1 замена
    // прежних com.android.support:*:28.0.0 / android.arch.lifecycle:extensions,
    // без смены минимальной функциональности.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Спайк Credential Manager (Фаза 0) — вход через Google на устройстве
    // без браузерного редиректа, см. GoogleSignInSpikeActivity.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Фаза 1 (org/docs/TODO_mobile_sync.md) — вызов POST /auth/nonce и
    // POST /auth/google/mobile. Остальной код проекта до сих пор обходился
    // голым HttpURLConnection (см. CurrencyPairRateListActivity) — здесь
    // взят OkHttp: асинхронные вызовы с JSON-телом на HttpURLConnection
    // пришлось бы писать вручную на потоках, а именно это и нужно для
    // синка (Фаза 2-3), так что заводить эту зависимость сейчас разумнее,
    // чем откладывать.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // EncryptedSharedPreferences — под access/refresh-токены (план, п. 5.1):
    // это секреты, обычные SharedPreferences для них не годятся.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Периодическая попытка соединения с сервером (экран «Настройки» →
    // «Синхронизация» → «Автоматическое подключение») — переживает выгрузку
    // процесса и перезагрузку устройства, в отличие от голого Handler/Timer.
    implementation 'androidx.work:work-runtime:2.9.0'
    // Вход по отпечатку на экране кода доступа (org/docs/TODO_app_lock.md, Фаза 2).
    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.12'
    // Настоящая (не заглушка android.jar, которая на unit-тестах кидает
    // "not mocked") реализация org.json — нужна только SyncEngineMissingReferenceTest,
    // чтобы собрать/разобрать JSONObject без Robolectric/эмулятора; тот же
    // API, тот же пакет org.json, testImplementation ставит его на classpath
    // раньше платформенного стаба.
    testImplementation 'org.json:json:20231013'
    // Robolectric — первый тест в проекте, которому нужна настоящая SQLiteDatabase/
    // Context/AssetManager (HardWipeCacheInvalidationTest: воспроизводит баг с
    // протухшим Singleton-кэшем после ResetDataActivity.onHardWipe на реальной
    // схеме БД), а не голые Java-модели, как у остальных unit-тестов — тем и
    // объясняется, почему его не было до сих пор (см. комментарий к org.json
    // выше).
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
